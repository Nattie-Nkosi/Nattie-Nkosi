<svg xmlns="http://www.w3.org/2000/svg" width="850" height="130" viewBox="0 0 850 130">
  <defs>
    <filter id="blob-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="line-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="850" height="130" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="850" height="130" fill="url(#bg)"/>

    <circle cx="200" cy="100" r="80" fill="#3b82f6" fill-opacity="0.05" filter="url(#blob-blur)">
      <animate attributeName="cx" values="200;250;200" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="30" r="70" fill="#8b5cf6" fill-opacity="0.05" filter="url(#blob-blur)">
      <animate attributeName="cx" values="650;600;650" dur="12s" repeatCount="indefinite"/>
    </circle>

    <rect x="100" y="20" width="650" height="90" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="url(#glass-border)" stroke-width="1"/>
    <line x1="115" y1="21" x2="735" y2="21" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5"/>

    <line x1="200" y1="42" x2="650" y2="42" stroke="url(#line-fade)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
    </line>

    <text x="425" y="68" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="300" font-style="italic">"Crafting elegant solutions to complex problems."</text>

    <text x="425" y="95" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" letter-spacing="2">BUILT WITH PASSION FROM JOHANNESBURG</text>

    <circle cx="373" y="95" r="1.5" fill="#3b82f6" fill-opacity="0.5"/>
    <circle cx="477" y="95" r="1.5" fill="#3b82f6" fill-opacity="0.5"/>
  </g>
</svg>