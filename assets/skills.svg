    </circle>
    <circle cx="700" cy="250" r="100" fill="#8b5cf6" fill-opacity="0.06" filter="url(#blob-blur)">
      <animate attributeName="cy" values="250;190;250" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="300" r="80" fill="#06b6d4" fill-opacity="0.04" filter="url(#blob-blur)">
      <animate attributeName="cx" values="425;480;425" dur="14s" repeatCount="indefinite"/>
    </circle>

