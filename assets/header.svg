<svg xmlns="http://www.w3.org/2000/svg" width="850" height="360" viewBox="0 0 850 360">
  <defs>
    <filter id="blob-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="45"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1425"/>
    </linearGradient>
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round-corners">
      <rect width="850" height="360" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round-corners)">
    <rect width="850" height="360" fill="url(#bg)"/>

    <circle cx="120" cy="80" r="140" fill="#3b82f6" fill-opacity="0.15" filter="url(#blob-blur)">
      <animate attributeName="cx" values="120;180;120" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;140;80" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="280" r="120" fill="#8b5cf6" fill-opacity="0.12" filter="url(#blob-blur)">
      <animate attributeName="cx" values="730;670;730" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="280;220;280" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="320" r="100" fill="#06b6d4" fill-opacity="0.1" filter="url(#blob-blur)">
      <animate attributeName="cx" values="400;460;400" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="320;260;320" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="60" r="80" fill="#3b82f6" fill-opacity="0.08" filter="url(#blob-blur)">
      <animate attributeName="cx" values="600;550;600" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;110;60" dur="11s" repeatCount="indefinite"/>
    </circle>

    <rect x="75" y="40" width="700" height="280" rx="20" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1"/>

    <line x1="95" y1="41" x2="755" y2="41" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.5"/>

    <rect x="75" y="40" width="700" height="1" rx="0.5" fill="#ffffff" fill-opacity="0.06"/>

    <text x="425" y="105" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" letter-spacing="6">SAWUBONA, I'M</text>

    <text x="425" y="165" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="1">Nkosinathi Nkosi</text>

    <line x1="275" y1="190" x2="575" y2="190" stroke="url(#accent-line)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </line>

    <text x="425" y="225" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      <tspan fill="#3b82f6" font-weight="600">Software Developer</tspan>
      <tspan fill="#475569">  ·  </tspan>
      <tspan fill="#94a3b8">Problem Solver</tspan>
      <tspan fill="#475569">  ·  </tspan>
      <tspan fill="#94a3b8">Innovator</tspan>
    </text>

    <text x="425" y="268" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" font-style="italic">Crafting elegant solutions to complex problems</text>

    <circle cx="385" cy="298" r="3" fill="#3b82f6" fill-opacity="0.6">
      <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="298" r="3" fill="#8b5cf6" fill-opacity="0.6">
      <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="435" cy="298" r="3" fill="#06b6d4" fill-opacity="0.6">
      <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="298" r="3" fill="#3b82f6" fill-opacity="0.6">
      <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="3s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>